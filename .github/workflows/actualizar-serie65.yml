name: Actualizar Serie 65

on:
  schedule:
    - cron: '0 2,20,22 * * *'
      timezone: America/New_York
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actualizar-serie65.yml'
      - 'update.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: actualizar-serie65
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Fecha de Miami
        id: fecha
        run: echo "dia=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"

      - name: Recuperar progreso
        uses: actions/cache/restore@v4
        with:
          path: .serie65-progress
          key: serie65-v2-${{ steps.fecha.outputs.dia }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            serie65-v2-${{ steps.fecha.outputs.dia }}-

      - name: Consultar fuentes y actualizar datos
        run: timeout --signal=TERM --kill-after=30s 85m python -u update.py

      - name: Guardar progreso aunque falle la consulta
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .serie65-progress
          key: serie65-v2-${{ steps.fecha.outputs.dia }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualizar datos de la Serie 65"
          git push

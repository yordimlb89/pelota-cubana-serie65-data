name: Actualizar Serie 65

on:
  schedule:
    - cron: '0 2,20,22 * * *'
      timezone: America/New_York
    - cron: '30 2,20,22 * * *'
      timezone: America/New_York
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actualizar-serie65.yml'
      - 'update.py'
      - 'download_pool.py'
      - 'test_download_pool.py'
      - 'audit.py'
      - 'merge.py'
      - 'test_integrity.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: actualizar-serie65
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Fecha de Miami
        id: fecha
        run: echo "dia=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"

      - name: Recuperar progreso
        uses: actions/cache/restore@v4
        with:
          path: .serie65-progress
          key: serie65-v3-${{ steps.fecha.outputs.dia }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            serie65-v3-${{ steps.fecha.outputs.dia }}-
            serie65-v3-
            serie65-v2-

      - name: Verificar controles de integridad
        run: python -m unittest -v test_integrity.py test_download_pool.py

      - name: Consultar fuentes y actualizar datos
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 2,20,22 * * *" ]; then
            if python -c 'import json,sys;sys.exit(0 if not json.load(open("data.json")).get("updateStatus",{}).get("partial",True) else 1)'; then
              echo "La última actualización está completa; no hace falta recuperación."
              exit 0
            fi
          fi
          timeout --signal=TERM --kill-after=30s 85m python -u update.py

      - name: Guardar progreso aunque falle la consulta
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .serie65-progress
          key: serie65-v3-${{ steps.fecha.outputs.dia }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Copia del avance de esta ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serie65-progreso-${{ github.run_id }}-${{ github.run_attempt }}
          path: data.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar datos aunque haya consultas pendientes
        if: always() && hashFiles('data.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish_dir=$(mktemp -d)
          cp data.json "$publish_dir/candidate.json"
          cp merge.py audit.py "$publish_dir/"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python "$publish_dir/merge.py" data.json "$publish_dir/candidate.json" "$publish_dir/merged.json"
            cp "$publish_dir/merged.json" data.json
            cp data.json "$publish_dir/candidate.json"
            git add data.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Actualizar datos de la Serie 65"
            if git push origin HEAD:main; then exit 0; fi
            echo "La rama avanzó; recombinando los datos (intento $attempt de 5)"
            sleep $((attempt * 2))
          done
          echo "::error::No se pudo publicar; el avance sigue guardado en caché y en el artefacto"
          exit 1

      - name: Verificar copia persistente del sitio
        if: always() && hashFiles('data.json') != ''
        timeout-minutes: 9
        run: |
          python - <<'PY'
          import json,time,urllib.request
          from datetime import datetime
          expected=json.load(open('data.json'))['snapshot']['updatedAt']
          def stamp(value):return int(datetime.fromisoformat(value.replace('Z','+00:00')).timestamp()*1000)
          for attempt in range(8):
              try:
                  req=urllib.request.Request('https://pelotacubanastats.com/api/storage-status',headers={'User-Agent':'PCUSA-GitHub-Cache/1.0'})
                  with urllib.request.urlopen(req,timeout=45) as response:
                      receipt=json.load(response)
                  stored=receipt.get('serie65') or {}
                  if receipt.get('persistent') and stamp(stored.get('source_updated_at',''))>=stamp(expected):
                      print('Serie 65 conservada en D1 y R2:',stored['hash'])
                      break
              except Exception as exc:
                  print('Comprobación pendiente:',type(exc).__name__)
              if attempt<7:time.sleep(60)
          else:raise SystemExit('No se pudo confirmar la copia persistente de la versión publicada')
          PY

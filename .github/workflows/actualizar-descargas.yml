name: Actualizar descargas oficiales Serie 65
on:
  schedule:
    - cron: '0 2,20,22 * * *'
      timezone: America/New_York
    - cron: '30 2,20,22 * * *'
      timezone: America/New_York
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actualizar-descargas.yml'
      - 'update_downloads.py'
      - 'parse_connections.py'
      - 'parse_extra.py'
      - 'download_reports.json'
      - 'test_downloads.py'
permissions:
  contents: write
concurrency:
  group: descargas-oficiales-serie65
  cancel-in-progress: false
jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar lector PDF
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Probar guardado parcial y reanudación
        run: python -m unittest test_downloads.py
      - name: Configurar checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Descargar y validar reportes independientes
        env:
          DOWNLOADS_PUSH_CHECKPOINTS: '1'
        run: python -u update_downloads.py
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: descargas-serie65-${{ github.run_id }}
          path: downloads/
          retention-days: 30
      - name: Publicar únicamente las descargas
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp -a downloads "$RUNNER_TEMP/verified-downloads"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -a "$RUNNER_TEMP/verified-downloads/." downloads/
            git add -- downloads/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Actualizar PDF y conexiones verificadas de Serie 65'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - name: Verificar actualización pública y copia D1/R2
        if: always()
        timeout-minutes: 8
        run: |
          python - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          expected=json.loads(Path('downloads/65.json').read_text())
          for attempt in range(12):
              try:
                  req=urllib.request.Request('https://pelotacubanastats.com/api/serie65-downloads',headers={'User-Agent':'PelotaCubanaStats-update-verifier/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      actual=json.load(response)
                  assert actual.get('persistent'), 'Copia D1/R2 sin confirmar'
                  assert actual.get('checkedAt','')>=expected['checkedAt'], 'La API todavía conserva el corte anterior'
                  for path,report in expected['reports'].items():
                      assert actual['reports'][path]['reportCreatedAt']>=report['reportCreatedAt'], 'Informe pendiente: '+path
                  print('Actualización pública y persistencia D1/R2 verificadas:',actual['checkedAt'])
                  break
              except Exception as error:
                  print('Reintento de verificación',attempt+1,str(error),flush=True)
                  if attempt==11:raise
                  time.sleep(30)
          PY

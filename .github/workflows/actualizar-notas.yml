name: Actualizar notas de juego Serie 65
on:
  schedule:
    - cron: '15,45 * * * *'
      timezone: America/New_York
  workflow_dispatch:
  workflow_run:
    workflows: ["Actualizar Serie 65", "Actualizar equipos Serie 65", "Actualizar splits Serie 65", "Actualizar descargas oficiales Serie 65"]
    types: [completed]
    branches: [main]
  push:
    paths:
      - '.github/workflows/actualizar-notas.yml'
      - 'refresh_game_notes.py'
      - 'refresh_notes_context.py'
permissions:
  contents: write
concurrency:
  group: notas-juego-serie65
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar contexto de los juegos
        continue-on-error: true
        run: python -u refresh_notes_context.py
      - name: Guardar cada juego verificado
        if: always()
        run: |
          if [ -f notes-context/65.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add notes-context/65.json
            if ! git diff --cached --quiet; then
              git commit -m "Actualizar contexto verificado de notas"
              for attempt in 1 2 3; do
                git pull --rebase && git push && break
                if [ "$attempt" = "3" ]; then exit 1; fi
              done
            fi
          fi
      - name: Actualizar y verificar las ediciones de datos
        if: always()
        run: python -u refresh_game_notes.py
      - name: Conservar los datos de las notas y el recibo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notas-serie65-${{ github.run_id }}
          path: game-notes/
          retention-days: 30
